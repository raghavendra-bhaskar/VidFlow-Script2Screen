[server]
# Allow uploads up to 10 GB (default is 200 MB)
maxUploadSize = 10240

# Bind to all network interfaces so the app is reachable from outside the host.
# Override with STREAMLIT_SERVER_ADDRESS env var if needed.
address = "0.0.0.0"

# Port — override with STREAMLIT_SERVER_PORT env var or pass --server.port on CLI.
port = 8501

# ── HTTPS / SSL ──────────────────────────────────────────────────────────────
# cert.pem + key.pem are generated by gen_cert.py (self-signed for localhost).
# For a real domain (e.g. hclswl2learninghub) use a proper cert or terminate
# SSL at nginx/Traefik/k8s Ingress and comment these two lines out.
sslCertFile = "cert.pem"
sslKeyFile  = "key.pem"
