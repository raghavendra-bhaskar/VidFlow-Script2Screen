# k8s/deployment.yaml — Kubernetes manifests for VidFlow Text-to-Video AI
#
# Resources defined here:
#   Namespace       vidflow
#   ConfigMap       vidflow-config       — non-secret env vars
#   Secret          vidflow-secrets      — API keys (base64-encoded)
#   PersistentVolumeClaim vidflow-data   — shared storage for recordings/output
#   Deployment      vidflow              — app pod (Streamlit + internal API server)
#   Service         vidflow-svc          — ClusterIP for Streamlit (8501) + API (8502)
#   Ingress         vidflow-ingress      — HTTPS via cert-manager / nginx-ingress
#
# Prerequisites:
#   kubectl, a k8s cluster, nginx-ingress controller, cert-manager (for TLS)
#
# Deploy:
#   kubectl apply -f k8s/deployment.yaml
#
# Monitor:
#   kubectl -n vidflow get pods
#   kubectl -n vidflow logs deploy/vidflow -f
#
# Access:
#   https://hclswl2learninghub  (after DNS points to ingress LoadBalancer IP)
#
# Important notes:
#   • The internal API server (port 8502) must also be reachable from the browser.
#     Set VIDFLOW_INTERNAL_HOST to the Ingress hostname and expose /api/ via the Ingress.
#   • For the self-signed-cert path: build a custom image that includes cert.pem/key.pem.
#     For production: use cert-manager (ClusterIssuer) so Let's Encrypt handles TLS.

---
apiVersion: v1
kind: Namespace
metadata:
  name: vidflow

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vidflow-config
  namespace: vidflow
data:
  # Hostname used in TLS cert SANs and shown in the UI
  VIDFLOW_DOMAIN: "hclswl2learninghub"
  # The browser reaches the internal API server via the Ingress /api/ path.
  # Set to the public hostname so the JS fetch() uses the same HTTPS connection.
  VIDFLOW_INTERNAL_HOST: "hclswl2learninghub"
  VIDFLOW_INTERNAL_PORT: "443"
  # No self-signed SSL inside the pod — nginx-ingress / cert-manager handles TLS
  NO_SSL: "1"
  # Gemini image model (change when newer models release without a code deploy)
  GEMINI_IMAGE_MODEL: "gemini-2.5-flash-image"

---
apiVersion: v1
kind: Secret
metadata:
  name: vidflow-secrets
  namespace: vidflow
type: Opaque
stringData:
  # Replace with real values before deploying.
  # kubectl create secret generic vidflow-secrets \
  #   --from-literal=GOOGLE_API_KEY=your_key \
  #   --from-literal=PEXELS_API_KEY=your_key \
  #   -n vidflow --dry-run=client -o yaml >> k8s/deployment.yaml
  GOOGLE_API_KEY: ""
  PEXELS_API_KEY: ""
  # Path is not meaningful in a pod — mount the JSON file as a Secret volume instead.
  GOOGLE_APPLICATION_CREDENTIALS: ""

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vidflow-data
  namespace: vidflow
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Adjust based on expected recording/video volume
      storage: 50Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vidflow
  namespace: vidflow
  labels:
    app: vidflow
spec:
  replicas: 1
  # Note: ReadWriteOnce PVC means only 1 replica can write at a time.
  # For multi-replica, switch PVC to ReadWriteMany (NFS/CephFS/EFS) and
  # add a proper shared state backend for the internal API server.
  selector:
    matchLabels:
      app: vidflow
  template:
    metadata:
      labels:
        app: vidflow
    spec:
      containers:
        - name: vidflow
          # Build and push your image: docker build -t your-registry/vidflow:latest .
          # Then update this field:
          image: your-registry/vidflow:latest
          imagePullPolicy: Always
          ports:
            - name: streamlit
              containerPort: 8501
            - name: api
              containerPort: 8502
          envFrom:
            - configMapRef:
                name: vidflow-config
            - secretRef:
                name: vidflow-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: data
              mountPath: /app/screen_recordings
              subPath: screen_recordings
            - name: data
              mountPath: /app/trimmed_videos
              subPath: trimmed_videos
            - name: data
              mountPath: /app/merged_videos
              subPath: merged_videos
            - name: video-narrated
              mountPath: /app/video+narrated
              subPath: video+narrated
            - name: data
              mountPath: /app/audio
              subPath: audio
            - name: data
              mountPath: /app/audio_edits
              subPath: audio_edits
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
              scheme: HTTPS
            initialDelaySeconds: 45
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vidflow-data
        - name: video-narrated
          persistentVolumeClaim:
            claimName: vidflow-data

---
apiVersion: v1
kind: Service
metadata:
  name: vidflow-svc
  namespace: vidflow
spec:
  selector:
    app: vidflow
  type: NodePort
  ports:
    - name: streamlit
      port: 8501
      targetPort: 8501
      nodePort: 30501
    - name: api
      port: 8502
      targetPort: 8502
      nodePort: 30502

---
# cert-manager ClusterIssuer — creates a Let's Encrypt HTTPS cert automatically.
# Install cert-manager first: https://cert-manager.io/docs/installation/
# Replace the email address below.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@hclswl2learninghub
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - http01:
          ingress:
            class: nginx

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vidflow-ingress
  namespace: vidflow
  annotations:
    # nginx-ingress controller
    kubernetes.io/ingress.class: nginx
    # cert-manager issues a TLS cert automatically
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Large uploads (videos up to 10 GB)
    nginx.ingress.kubernetes.io/proxy-body-size: "10g"
    # Long timeouts for video processing
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    # WebSocket support for Streamlit live updates
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
    - hosts:
        - hclswl2learninghub
      secretName: vidflow-tls
  rules:
    - host: hclswl2learninghub
      http:
        paths:
          # Main Streamlit UI
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vidflow-svc
                port:
                  number: 8501
          # Internal API server (trim drag-handle + screen recorder)
          # The browser JS in app.py uses VIDFLOW_INTERNAL_HOST:VIDFLOW_INTERNAL_PORT.
          # Setting those to "hclswl2learninghub" and "443" routes through this path.
          - path: /api/
            pathType: Prefix
            backend:
              service:
                name: vidflow-svc
                port:
                  number: 8502
