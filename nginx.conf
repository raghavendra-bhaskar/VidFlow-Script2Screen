# nginx.conf — Reverse proxy for VidFlow on a Linux VM.
#
# Deployment model:
#   • Streamlit runs on http://127.0.0.1:8501 (NO_SSL=1, plain HTTP internally)
#   • The internal API server runs on http://127.0.0.1:8502
#   • nginx terminates TLS and proxies both to the outside world over HTTPS
#
# Quick start (Ubuntu/Debian):
#   sudo apt install nginx
#   sudo cp nginx.conf /etc/nginx/sites-available/vidflow
#   sudo ln -sf /etc/nginx/sites-available/vidflow /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Certificate options:
#   A) Self-signed (internal/LAN):
#        VIDFLOW_DOMAIN=hclswl2learninghub python gen_cert.py
#        Then set ssl_certificate / ssl_certificate_key below to cert.pem / key.pem.
#   B) Let's Encrypt (public internet):
#        sudo apt install certbot python3-certbot-nginx
#        sudo certbot --nginx -d hclswl2learninghub
#        certbot will auto-update this file.
#
# Replace "hclswl2learninghub" with your actual hostname throughout.

upstream vidflow_app {
    server 127.0.0.1:8501;
}

upstream vidflow_api {
    # Internal API server (trim drag-handle + screen recorder save)
    server 127.0.0.1:8502;
}

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name hclswl2learninghub;
    return 301 https://$host$request_uri;
}

# ── HTTPS main server ─────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name hclswl2learninghub;

    # ── TLS certificates ──────────────────────────────────────────────────────
    # Self-signed (generated by gen_cert.py):
    ssl_certificate     /path/to/vidflow/cert.pem;
    ssl_certificate_key /path/to/vidflow/key.pem;
    # Let's Encrypt alternative (managed by certbot):
    # ssl_certificate     /etc/letsencrypt/live/hclswl2learninghub/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/hclswl2learninghub/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Max upload size matching Streamlit's maxUploadSize (10 GB)
    client_max_body_size 10g;

    # ── Streamlit app (main UI) ───────────────────────────────────────────────
    location / {
        proxy_pass         http://vidflow_app;
        proxy_http_version 1.1;

        # WebSocket support — Streamlit uses WebSockets for live updates
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Long timeouts for video generation / TTS which can take minutes
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── Internal API server (trim + screen recorder) ─────────────────────────
    # The browser JS calls /api/... which nginx routes to the internal server.
    # NOTE: the JS in app.py uses _INTERNAL_BASE directly — in a VM deployment
    # set VIDFLOW_INTERNAL_HOST=hclswl2learninghub and VIDFLOW_INTERNAL_PORT=443
    # and serve /api/ here so the browser uses the same HTTPS connection.
    location /api/ {
        rewrite            ^/api/(.*) /$1 break;
        proxy_pass         http://vidflow_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        client_max_body_size 10g;
    }
}
